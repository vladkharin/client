name: Messenger Frontend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build on GitHub & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: 🏗️ Build Next.js (on GitHub Actions 16GB RAM)
        run: |
          npm run build
          rm -rf .next/cache
          tar -czf frontend-build.tar.gz .next public package.json package-lock.json
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 🚚 Transfer & Deploy via Native SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass
          
          # 1. Создаем папку на сервере если нет
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "mkdir -p ~/projects/messenger-frontend"

          # 2. Быстро передаем 15MB архив напрямую
          sshpass -e scp -o StrictHostKeyChecking=no -P $PORT frontend-build.tar.gz $USER@$HOST:~/projects/messenger-frontend/

          # 3. Распаковываем и перезапускаем PM2
          sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            cd ~/projects/messenger-frontend &&
            tar -xzf frontend-build.tar.gz &&
            rm -f frontend-build.tar.gz &&
            npm install --production --prefer-offline || true &&
            pm2 restart messenger-client || pm2 start npm --name 'messenger-client' -- start &&
            echo '✅ Messenger Frontend deployed successfully!'
          "
