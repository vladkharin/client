name: Messenger Frontend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build on GitHub & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: 🏗️ Build Next.js (on GitHub Actions 16GB RAM)
        run: |
          npm run build
          rm -rf .next/cache
          tar -czf frontend-build.tar.gz .next public package.json package-lock.json
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 🚚 Stream & Deploy to VPS over SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          USER: ${{ secrets.SERVER_USER || secrets.VPS_USER }}
          PORT: ${{ secrets.SERVER_PORT || secrets.VPS_PORT || 22 }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y sshpass
          
          # Прямая передача через SSH pipe в tar (100% совместимо со всеми VPS)
          cat frontend-build.tar.gz | sshpass -e ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            mkdir -p ~/projects/messenger-frontend &&
            cd ~/projects/messenger-frontend &&
            tar -xzf - &&
            npm install --production --prefer-offline || true &&
            pm2 restart messenger-client || pm2 start npm --name 'messenger-client' -- start &&
            echo '✅ Messenger Frontend deployed successfully!'
          "
