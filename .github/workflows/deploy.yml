name: Messenger Frontend Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy-to-server:
    name: 🚀 Deploy Frontend to VPS (PM2)
    runs-on: ubuntu-latest

    steps:
      - name: 📡 SSH Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Deploying Messenger Frontend..."
            cd ~/projects/messenger-frontend || exit 1
            git fetch --all
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart messenger-client
            echo "✅ Messenger Frontend deployed successfully!"
