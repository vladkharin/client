<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer subtle hexagon / hive border -->
  <path d="M 256 70 L 416 162.4 L 416 349.6 L 256 442 L 96 349.6 L 96 162.4 Z" 
        fill="none" 
        stroke="#6366f1" 
        stroke-width="8" 
        stroke-opacity="0.3" />

  <!-- Inner glowing hexagon -->
  <path d="M 256 100 L 386 175 L 386 337 L 256 412 L 126 337 L 126 175 Z" 
        fill="#1e1b4b" 
        fill-opacity="0.4"
        stroke="url(#boltGrad)" 
        stroke-width="6" 
        stroke-opacity="0.8" />

  <!-- Lightning Bolt (CraftHive Logo) -->
  <path d="M 276 140 L 176 270 L 246 270 L 236 372 L 336 242 L 266 242 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />
</svg>
